<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300a2e8'><path d='M3 3h18v18H3V3zm16 16V5H5v14h14zM7 7h10v2H7V7zm0 4h10v2H7v-2zm0 4h7v2H7v-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcu | SupplyFinance Suite</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('calcu_theme');
          var isDark = saved === 'dark' || (saved === 'dark_bitrix') || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (saved === 'light' || saved === 'light_bitrix') isDark = false;
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#eef2f4] dark:bg-slate-950 text-[#333333] dark:text-slate-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
